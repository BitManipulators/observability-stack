# RBAC for OpenTelemetry Collector to use k8sattributes processor
# This allows the collector to query K8s API for pod/node metadata

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector-sa
  namespace: default

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-collector-k8s-reader
rules:
  # Required for k8sattributes processor to get pod info
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes"]
    verbs: ["get", "watch", "list"]
  # Required for k8sattributes to get ReplicaSet info (to resolve Deployment names)
  - apiGroups: ["apps"]
    resources: ["replicasets", "deployments"]
    verbs: ["get", "watch", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-collector-k8s-reader-binding
subjects:
  - kind: ServiceAccount
    name: otel-collector-sa
    namespace: default
roleRef:
  kind: ClusterRole
  name: otel-collector-k8s-reader
  apiGroup: rbac.authorization.k8s.io

