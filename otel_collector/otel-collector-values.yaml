# Use the 'contrib' image and tag
image:
  repository: otel/opentelemetry-collector-contrib
  tag: 0.103.0

# Deploy as a Deployment (not DaemonSet)
mode: deployment

# --- Use our custom ServiceAccount with K8s API permissions ---
serviceAccount:
  create: false  # We created it manually via otel-collector-rbac.yaml
  name: otel-collector-sa

config:
  # 1. RECEIVERS
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  # 2. PROCESSORS
  processors:
    batch: {}
    
    # --- K8s Attributes Processor ---
    # Enriches telemetry with Kubernetes metadata by querying the K8s API
    k8sattributes:
      auth_type: "serviceAccount"
      passthrough: false  # Process telemetry, don't just pass through
      
      # Filter to only process pods in same namespace (optional, for performance)
      filter:
        node_from_env_var: K8S_NODE_NAME  # Only watch pods on same node
      
      # What metadata to extract
      extract:
        metadata:
          - k8s.pod.name
          - k8s.pod.uid
          - k8s.namespace.name
          - k8s.node.name
          - k8s.deployment.name
          - k8s.pod.start_time
        # Extract labels from the pod
        labels:
          - tag_name: app.label
            key: app
            from: pod
        # Extract annotations (optional)
        annotations:
          - tag_name: app.annotation.version
            key: version
            from: pod
      
      # How to associate telemetry with pods
      pod_association:
        - sources:
            - from: resource_attribute
              name: k8s.pod.ip
        - sources:
            - from: resource_attribute
              name: k8s.pod.uid
        - sources:
            - from: connection

  # 3. EXPORTERS
  exporters:
    # --- Exporter for LOGS to LOKI ---
    loki:
      endpoint: "http://loki-gateway.loki.svc.cluster.local:80/loki/api/v1/push"
      tls:
        insecure: true
    
    # --- Exporter for TRACES to JAEGER ---
    otlp/jaeger:
      endpoint: "jaeger-all-in-one-collector.jaeger.svc.cluster.local:4317"
      tls:
        insecure: true

    # --- Use 'debug' exporter ---
    debug:
      verbosity: detailed

  # 4. SERVICE
  service:
    telemetry:
      metrics:
        address: 0.0.0.0:8889

    pipelines:
      # --- TRACES Pipeline ---
      traces:
        receivers: [otlp]
        processors: [k8sattributes, batch]  # k8sattributes BEFORE batch
        exporters: [otlp/jaeger, debug]

      # --- METRICS Pipeline (if you use it) ---
      metrics:
        receivers: [otlp]
        processors: [k8sattributes, batch]
        exporters: [debug]

      # --- LOGS Pipeline ---
      logs:
        receivers: [otlp]
        processors: [k8sattributes, batch]  # k8sattributes BEFORE batch
        exporters: [loki, debug]
