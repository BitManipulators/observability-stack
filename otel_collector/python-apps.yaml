# --- 1. The ConfigMap (holds our Python code) ---
apiVersion: v1
kind: ConfigMap
metadata:
  name: python-apps-cm
data:
  # --- Service A (The "Frontend") ---
  service_a.py: |
    import os
    import requests
    import logging
    from flask import Flask
    
    from opentelemetry import trace
    from opentelemetry.sdk.trace import TracerProvider
    from opentelemetry.sdk.resources import Resource
    from opentelemetry.exporter.otlp.proto.grpc.trace_exporter import OTLPSpanExporter
    from opentelemetry.sdk.trace.export import BatchSpanProcessor
    
    # --- (FIX) Import Log SDK components ---
    from opentelemetry.sdk._logs import LoggerProvider, LoggingHandler
    from opentelemetry.sdk._logs.export import BatchLogRecordProcessor
    from opentelemetry.exporter.otlp.proto.grpc._log_exporter import OTLPLogExporter
    
    # --- Auto-instrumentation ---
    from opentelemetry.instrumentation.flask import FlaskInstrumentor
    from opentelemetry.instrumentation.requests import RequestsInstrumentor

    # --- OTel Resource Setup (for both traces and logs) ---
    resource = Resource(attributes={"service.name": "service-a"})

    # --- OTel Setup for Traces ---
    trace_provider = TracerProvider(resource=resource)
    otlp_trace_exporter = OTLPSpanExporter() 
    trace_provider.add_span_processor(BatchSpanProcessor(otlp_trace_exporter))
    trace.set_tracer_provider(trace_provider)
    tracer = trace.get_tracer(__name__)
    
    # --- (FIX) OTel Setup for LOGS ---
    logger_provider = LoggerProvider(resource=resource)
    otlp_log_exporter = OTLPLogExporter()
    logger_provider.add_log_record_processor(BatchLogRecordProcessor(otlp_log_exporter))
    
    # This attaches OTel to Python's standard logging
    handler = LoggingHandler(level=logging.INFO, logger_provider=logger_provider)
    logging.getLogger().addHandler(handler)
    
    # Configure standard logging
    logging.basicConfig(level=logging.INFO)
    logger = logging.getLogger(__name__)

    # Create Flask App
    app = Flask(__name__)
    FlaskInstrumentor().instrument_app(app)
    RequestsInstrumentor().instrument()

    @app.route("/")
    def call_service_b():
        with tracer.start_as_current_span("call-service-b") as span:
            # The logger now automatically includes trace_id
            logger.info("Service A: Received request. Calling service-b...")
            
            try:
                response = requests.get("http://service-b:8080/")
                logger.info("Service A: Got response from service-b")
                return f"Service A says: Hello! -> {response.text}"
            except Exception as e:
                logger.error(f"Service A: Error calling service-b: {e}")
                return "Error calling service-b", 500

    if __name__ == "__main__":
        app.run(host="0.0.0.0", port=8080)

  # --- Service B (The "Backend") ---
  service_b.py: |
    import os
    import logging
    from flask import Flask
    
    from opentelemetry import trace
    from opentelemetry.sdk.trace import TracerProvider
    from opentelemetry.sdk.resources import Resource
    from opentelemetry.exporter.otlp.proto.grpc.trace_exporter import OTLPSpanExporter
    from opentelemetry.sdk.trace.export import BatchSpanProcessor
    
    # --- (FIX) Import Log SDK components ---
    from opentelemetry.sdk._logs import LoggerProvider, LoggingHandler
    from opentelemetry.sdk._logs.export import BatchLogRecordProcessor
    from opentelemetry.exporter.otlp.proto.grpc._log_exporter import OTLPLogExporter
    
    from opentelemetry.instrumentation.flask import FlaskInstrumentor

    # --- OTel Resource Setup (for both traces and logs) ---
    resource = Resource(attributes={"service.name": "service-b"})

    # --- OTel Setup for Traces ---
    trace_provider = TracerProvider(resource=resource)
    otlp_trace_exporter = OTLPSpanExporter()
    trace_provider.add_span_processor(BatchSpanProcessor(otlp_trace_exporter))
    trace.set_tracer_provider(trace_provider)
    tracer = trace.get_tracer(__name__)
    
    # --- (FIX) OTel Setup for LOGS ---
    logger_provider = LoggerProvider(resource=resource)
    otlp_log_exporter = OTLPLogExporter()
    logger_provider.add_log_record_processor(BatchLogRecordProcessor(otlp_log_exporter))
    
    handler = LoggingHandler(level=logging.INFO, logger_provider=logger_provider)
    logging.getLogger().addHandler(handler)

    logging.basicConfig(level=logging.INFO)
    logger = logging.getLogger(__name__)

    # Create Flask App
    app = Flask(__name__)
    FlaskInstrumentor().instrument_app(app)

    @app.route("/")
    def handle_request():
        with tracer.start_as_current_span("handle-request-in-b"):
            # This log will also have trace_id
            logger.info("Service B: Received request.")
            return "Service B says: Hi from B!"

    if __name__ == "__main__":
        app.run(host="0.0.0.0", port=8080)

---
# --- 2. Service A Deployment & Service ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-a-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-a
  template:
    metadata:
      labels:
        app: service-a
    spec:
      containers:
      - name: service-a
        image: python:3.10-slim
        command: ["/bin/sh", "-c"]
        # (FIX) Added opentelemetry-exporter-otlp-proto-grpc to the install
        args:
        - "pip install Flask opentelemetry-sdk opentelemetry-api opentelemetry-exporter-otlp-proto-grpc opentelemetry-instrumentation-flask requests opentelemetry-instrumentation-requests && python /app/service_a.py"
        ports:
        - containerPort: 8080
        env:
        - name: OTEL_SERVICE_NAME
          value: "service-a"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "otel-collector-opentelemetry-collector.default.svc.cluster.local:4317"
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: "grpc"
        - name: OTEL_EXPORTER_OTLP_INSECURE
          value: "true"
        - name: OTEL_LOGS_EXPORTER
          value: "otlp"
        volumeMounts:
        - name: scripts
          mountPath: /app
      volumes:
      - name: scripts
        configMap:
          name: python-apps-cm
---
apiVersion: v1
kind: Service
metadata:
  name: service-a
spec:
  selector:
    app: service-a
  ports:
  - port: 8080
---
# --- 3. Service B Deployment & Service ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-b-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-b
  template:
    metadata:
      labels:
        app: service-b
    spec:
      containers:
      - name: service-b
        image: python:3.10-slim
        command: ["/bin/sh", "-c"]
        # (FIX) Added opentelemetry-exporter-otlp-proto-grpc to the install
        args:
        - "pip install Flask opentelemetry-sdk opentelemetry-api opentelemetry-exporter-otlp-proto-grpc opentelemetry-instrumentation-flask && python /app/service_b.py"
        ports:
        - containerPort: 8080
        env:
        - name: OTEL_SERVICE_NAME
          value: "service-b"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "otel-collector-opentelemetry-collector.default.svc.cluster.local:4317"
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: "grpc"
        - name: OTEL_EXPORTER_OTLP_INSECURE
          value: "true"
        - name: OTEL_LOGS_EXPORTER
          value: "otlp"
        volumeMounts:
        - name: scripts
          mountPath: /app
      volumes:
      - name: scripts
        configMap:
          name: python-apps-cm
---
apiVersion: v1
kind: Service
metadata:
  name: service-b
spec:
  selector:
    app: service-b
  ports:
  - port: 8080
