# --- 1. The ConfigMap (holds our Python code) ---
apiVersion: v1
kind: ConfigMap
metadata:
  name: python-apps-cm
data:
  # --- Service A (The "Frontend") ---
  service_a.py: |
    import os
    import requests
    import logging
    from flask import Flask
    
    from opentelemetry import trace
    from opentelemetry.sdk.trace import TracerProvider
    from opentelemetry.sdk.resources import Resource
    from opentelemetry.exporter.otlp.proto.grpc.trace_exporter import OTLPSpanExporter
    from opentelemetry.sdk.trace.export import BatchSpanProcessor
    
    # --- Auto-instrumentation ---
    # This automatically creates spans for Flask requests
    from opentelemetry.instrumentation.flask import FlaskInstrumentor
    # This automatically propagates trace headers for 'requests' calls
    from opentelemetry.instrumentation.requests import RequestsInstrumentor

    # --- OTel Setup for Traces ---
    # This ensures all traces have the service.name="service-a"
    resource = Resource(attributes={"service.name": "service-a"})
    provider = TracerProvider(resource=resource)
    
    # This is the OTLP exporter that sends to our collector (configured by env vars)
    otlp_exporter = OTLPSpanExporter() 
    provider.add_span_processor(BatchSpanProcessor(otlp_exporter))
    trace.set_tracer_provider(provider)
    
    # Get a tracer for this specific app
    tracer = trace.get_tracer(__name__)
    
    # Configure logging
    logging.basicConfig(level=logging.INFO)
    logger = logging.getLogger(__name__)

    # Create Flask App
    app = Flask(__name__)
    
    # --- Apply auto-instrumentation ---
    FlaskInstrumentor().instrument_app(app)
    RequestsInstrumentor().instrument()

    @app.route("/")
    def call_service_b():
        # This whole function will be a "parent span"
        with tracer.start_as_current_span("call-service-b") as span:
            
            logger.info("Service A: Received request. Calling service-b...")
            
            # Use 'requests' to call Service B
            # The 'RequestsInstrumentor' automatically adds trace headers
            try:
                response = requests.get("http://service-b:8080/") # Use the service name
                logger.info("Service A: Got response from service-b")
                return f"Service A says: Hello! -> {response.text}"
            except Exception as e:
                logger.error(f"Service A: Error calling service-b: {e}")
                return "Error calling service-b", 500

    if __name__ == "__main__":
        app.run(host="0.0.0.0", port=8080)

  # --- Service B (The "Backend") ---
  service_b.py: |
    import os
    import logging
    from flask import Flask
    
    from opentelemetry import trace
    from opentelemetry.sdk.trace import TracerProvider
    from opentelemetry.sdk.resources import Resource
    from opentelemetry.exporter.otlp.proto.grpc.trace_exporter import OTLPSpanExporter
    from opentelemetry.sdk.trace.export import BatchSpanProcessor
    from opentelemetry.instrumentation.flask import FlaskInstrumentor

    # --- OTel Setup for Traces ---
    resource = Resource(attributes={"service.name": "service-b"})
    provider = TracerProvider(resource=resource)
    otlp_exporter = OTLPSpanExporter()
    provider.add_span_processor(BatchSpanProcessor(otlp_exporter))
    trace.set_tracer_provider(provider)
    
    tracer = trace.get_tracer(__name__)
    
    logging.basicConfig(level=logging.INFO)
    logger = logging.getLogger(__name__)

    # Create Flask App
    app = Flask(__name__)
    FlaskInstrumentor().instrument_app(app)

    @app.route("/")
    def handle_request():
        # This will automatically be a "child span"
        # because FlaskInstrumentor detects the incoming trace headers
        with tracer.start_as_current_span("handle-request-in-b"):
            logger.info("Service B: Received request.")
            return "Service B says: Hi from B!"

    if __name__ == "__main__":
        app.run(host="0.0.0.0", port=8080)

---
# --- 2. Service A Deployment & Service ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-a-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-a
  template:
    metadata:
      labels:
        app: service-a
    spec:
      containers:
      - name: service-a
        image: python:3.10-slim
        # This command installs our libraries, then runs our python script
        command: ["/bin/sh", "-c"]
        args:
        - "pip install Flask opentelemetry-sdk opentelemetry-api opentelemetry-exporter-otlp opentelemetry-instrumentation-flask opentelemetry-instrumentation-requests && python /app/service_a.py"
        ports:
        - containerPort: 8080
        # --- OTel Environment Variables ---
        env:
        - name: OTEL_SERVICE_NAME
          value: "service-a"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          # This points to your collector in the 'loki' namespace
          value: "otel-collector-opentelemetry-collector.default.svc.cluster.local:4317"
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: "grpc"
        - name: OTEL_EXPORTER_OTLP_INSECURE
          value: "true"
        # --- This is the key for OTel LOGS ---
        - name: OTEL_LOGS_EXPORTER
          value: "otlp"
        - name: OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED
          value: "true"
        # Mount our script from the ConfigMap
        volumeMounts:
        - name: scripts
          mountPath: /app
      volumes:
      - name: scripts
        configMap:
          name: python-apps-cm
---
apiVersion: v1
kind: Service
metadata:
  name: service-a
spec:
  selector:
    app: service-a
  ports:
  - port: 8080
---
# --- 3. Service B Deployment & Service ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-b-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-b
  template:
    metadata:
      labels:
        app: service-b
    spec:
      containers:
      - name: service-b
        image: python:3.10-slim
        # This command installs libraries, then runs the other script
        command: ["/bin/sh", "-c"]
        args:
        - "pip install Flask opentelemetry-sdk opentelemetry-api opentelemetry-exporter-otlp opentelemetry-instrumentation-flask && python /app/service_b.py"
        ports:
        - containerPort: 8080
        # --- OTel Environment Variables ---
        env:
        - name: OTEL_SERVICE_NAME
          value: "service-b"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "otel-collector-opentelemetry-collector.default.svc.cluster.local:4317"
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: "grpc"
        - name: OTEL_EXPORTER_OTLP_INSECURE
          value: "true"
        - name: OTEL_LOGS_EXPORTER
          value: "otlp"
        - name: OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED
          value: "true"
        # Mount our scripts from the *same* ConfigMap
        volumeMounts:
        - name: scripts
          mountPath: /app
      volumes:
      - name: scripts
        configMap:
          name: python-apps-cm
---
apiVersion: v1
kind: Service
metadata:
  name: service-b
spec:
  selector:
    app: service-b
  ports:
  - port: 8080
