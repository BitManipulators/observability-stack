# Use the 'contrib' image and tag
image:
  repository: otel/opentelemetry-collector-contrib
  tag: 0.103.0

# Deploy as a DaemonSet on each node
mode: deployment

config:
  # 1. RECEIVERS
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  # 2. PROCESSORS
  processors:
    batch: {}

  # 3. EXPORTERS
  exporters:
    # --- Exporter for LOGS to LOKI ---
    loki:
      # NOTE: This is your Loki endpoint. Verify it's correct.
      endpoint: "http://loki-gateway.loki.svc.cluster.local:80/loki/api/v1/push"
      tls:
        insecure: true
      # --- (FIX) The invalid 'attributes' block has been removed ---
      # The collector will forward the trace_id by default.
    
    # --- Exporter for TRACES to JAEGER ---
    otlp/jaeger:
      endpoint: "jaeger-all-in-one-collector.jaeger.svc.cluster.local:4317"
      tls:
        insecure: true

    # --- Use 'debug' exporter ---
    debug:
      verbosity: detailed

  # 4. SERVICE
  service:
    telemetry:
      metrics:
        address: 0.0.0.0:8889

    pipelines:
      # --- TRACES Pipeline ---
      traces:
        receivers: [otlp]
        processors: [batch]
        exporters: [otlp/jaeger, debug]

      # --- METRICS Pipeline (if you use it) ---
      metrics:
        receivers: [otlp]
        processors: [batch]
        exporters: [debug]

      # --- LOGS Pipeline ---
      logs:
        receivers: [otlp]
        processors: [batch]
        exporters: [loki, debug]
